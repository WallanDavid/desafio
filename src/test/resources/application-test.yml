spring:
  datasource:
    url: jdbc:h2:mem:test_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration

activation:
  provider:
    base-url: http://localhost:8089
    connect-timeout-ms: 1000
    read-timeout-ms: 1500
  reconciliation:
    enabled: false
